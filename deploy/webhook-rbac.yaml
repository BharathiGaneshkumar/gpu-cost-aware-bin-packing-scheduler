apiVersion: v1
kind: ServiceAccount
metadata:
  name: scheduler-webhook
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scheduler-webhook-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scheduler-webhook-pod-reader-binding
subjects:
  - kind: ServiceAccount
    name: scheduler-webhook
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: scheduler-webhook-pod-reader
  apiGroup: rbac.authorization.k8s.io