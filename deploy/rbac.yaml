apiVersion: v1
kind: ServiceAccount
metadata:
  name: simulated-gpu-device-plugin
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: simulated-gpu-device-plugin-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: simulated-gpu-device-plugin-node-reader-binding
subjects:
  - kind: ServiceAccount
    name: simulated-gpu-device-plugin
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: simulated-gpu-device-plugin-node-reader
  apiGroup: rbac.authorization.k8s.io