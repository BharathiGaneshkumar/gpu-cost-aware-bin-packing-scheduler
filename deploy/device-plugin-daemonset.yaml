apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: simulated-gpu-device-plugin
  namespace: kube-system
  labels:
    app: simulated-gpu-device-plugin
spec:
  selector:
    matchLabels:
      app: simulated-gpu-device-plugin
  template:
    metadata:
      labels:
        app: simulated-gpu-device-plugin
    spec:
      serviceAccountName: simulated-gpu-device-plugin
      priorityClassName: system-node-critical
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: gpu-id
                    operator: Exists
      containers:
        - name: simulated-gpu-device-plugin
          image: simulated-gpu-device-plugin:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins